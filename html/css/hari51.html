// Cara menambahkan JavaScript

// 1. Inline (tidak disarankan)
<button onclick="alert('Hello!')">Klik</button>

// 2. Internal
<script>
    console.log("Hello, World!");
</script>

// 3. External (disarankan)
<script src="script.js"></script>

// Output
console.log("Console");    // Di console browser
alert("Alert");             // Popup
document.write("Tulis");  // Di halaman
