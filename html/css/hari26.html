<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Display CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Block -->
    <div>Ini adalah elemen Block (div)</div>

    <!-- Inline -->
    <span>Ini adalah elemen Inline (span)</span>

    <br><br>

    <!-- Inline-block -->
    <a href="#" class="btn">Tombol Inline-Block</a>

    <br><br>

    <!-- None -->
    <p class="hidden">Teks ini disembunyikan dengan display: none;</p>

    <!-- Flex -->
    <h3>Display Flex</h3>
    <div class="container-flex">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

    <br>

    <!-- Grid -->
    <h3>Display Grid</h3>
    <div class="container-grid">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>
    </div>

</body>
</html>
